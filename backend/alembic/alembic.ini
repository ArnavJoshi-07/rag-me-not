# Alembic config. Everything Alembic uses lives in this folder.
# The database URL is not set here, env.py builds it from the POSTGRES_* env vars.
# Alembic looks for alembic.ini in the current directory: run it from this folder, pass -c alembic/alembic.ini,
# or set ALEMBIC_CONFIG (the Docker image does).

[alembic]
script_location = %(here)s
# revisions use sequential ids (0001, 0002, ...) -> create new ones with `alembic revision -m "..." --rev-id 0017`
file_template = %%(rev)s_%%(slug)s
# backend/ goes on sys.path, so env.py can import the app's models once they exist
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
